spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/itop_dev
    username: itop
    password: itop123

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    com.itop: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: DevSecretKeyForJWTTokenGenerationMustBe256BitsOrLonger

itop:
  version: 1.0.0-DEV
  security:
    swagger-enabled: true
    cors:
      allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

app:
  upload:
    dir: uploads
