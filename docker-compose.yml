services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: itop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itop
      POSTGRES_USER: itop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itop123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - itop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itop -d itop"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Spring Boot API Backend
  itop-api:
    build:
      context: .
      dockerfile: itop-api/Dockerfile
    image: itop-api:latest
    container_name: itop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itop
      SPRING_DATASOURCE_USERNAME: itop
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-itop123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-YourSecretKeyForJWTTokenGenerationMustBe256BitsOrLonger}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_UPLOAD_DIR: /app/uploads
      JAVA_OPTS: -Xms512m -Xmx1024m -XX:+UseG1GC
    volumes:
      - request_uploads:/app/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - itop-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Vue 3 Frontend
  itop-web:
    build:
      context: .
      dockerfile: itop-web/Dockerfile
    image: itop-web:latest
    container_name: itop-web
    restart: unless-stopped
    depends_on:
      - itop-api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - itop-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  itop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  request_uploads:
    driver: local
